name: CareerBridge XAI Tests

on:
  push:
    branches:
      - feature/careerbridge-xai
  pull_request:
    branches:
      - main

jobs:
  xai-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pydantic fastapi JayDeBeApi JPype1

      - name: Run CareerBridge XAI tests
        run: python -m pytest backend/tests/test_xai_*.py -q
